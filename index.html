<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Planner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: rgba(255,255,255,0.92);
    --card: rgba(0,0,0,0.04);
    --card-hover: rgba(0,0,0,0.06);
    --text: #111;
    --text2: #666;
    --text3: #aaa;
    --border: rgba(0,0,0,0.08);
    --accent: #2563eb;
    --accent-light: rgba(37,99,235,0.08);
    --done: #22c55e;
    --done-bg: rgba(34,197,94,0.08);
    --overdue: #dc2626;
    --overdue-bg: rgba(220,38,38,0.06);
    --overdue-border: rgba(220,38,38,0.15);
    --input-bg: rgba(0,0,0,0.04);
    --section-label: #999;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: rgba(30,30,30,0.94);
      --card: rgba(255,255,255,0.06);
      --card-hover: rgba(255,255,255,0.09);
      --text: #e8e8e8;
      --text2: #999;
      --text3: #555;
      --border: rgba(255,255,255,0.08);
      --accent: #3b82f6;
      --accent-light: rgba(59,130,246,0.12);
      --done: #22c55e;
      --done-bg: rgba(34,197,94,0.1);
      --overdue: #f87171;
      --overdue-bg: rgba(248,113,113,0.1);
      --overdue-border: rgba(248,113,113,0.2);
      --input-bg: rgba(255,255,255,0.07);
      --section-label: #666;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Top bar with arrow nub ── */
  .topbar {
    position: relative;
    padding: 14px 16px 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-shrink: 0;
  }
  .topbar::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 6px;
    background: var(--bg);
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }
  .clock { font-size: 13px; font-weight: 600; color: var(--text); }
  .date-label { font-size: 11px; color: var(--text2); }

  /* ── Sections ── */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 12px;
  }
  .scroll-area::-webkit-scrollbar { width: 5px; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .section { margin-bottom: 10px; }
  .section-header {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--section-label);
    padding: 6px 4px 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .section-header .dot {
    width: 5px; height: 5px; border-radius: 50%;
    display: inline-block;
  }
  .dot-now { background: var(--accent); }
  .dot-next { background: var(--text3); }
  .dot-overdue { background: var(--overdue); animation: pulse 2s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .empty-msg {
    font-size: 11px;
    color: var(--text3);
    padding: 6px 4px;
    font-style: italic;
  }

  /* ── Task cards ── */
  .task {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--card);
    margin-bottom: 3px;
    cursor: default;
    transition: background 0.1s;
  }
  .task:hover { background: var(--card-hover); }
  .task.overdue { background: var(--overdue-bg); border: 1px solid var(--overdue-border); }
  .task.done { background: var(--done-bg); opacity: 0.7; }

  .cb {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: 2px solid var(--text3);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #fff;
    transition: all 0.15s;
  }
  .cb:hover { border-color: var(--accent); }
  .task.done .cb { background: var(--done); border-color: var(--done); }

  .task-info { flex: 1; min-width: 0; }
  .task-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task.done .task-title { text-decoration: line-through; color: var(--text3); }
  .task.overdue .task-title { color: var(--overdue); }

  .task-sub {
    font-size: 9px;
    color: var(--text3);
    margin-top: 1px;
    display: flex;
    gap: 6px;
  }
  .task-sub .pri { font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .pri-low { color: #6b7280; }
  .pri-medium { color: #2563eb; }
  .pri-high { color: #f59e0b; }
  .pri-urgent { color: #dc2626; }

  .task-time {
    font-size: 10px;
    color: var(--text3);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .badge-overdue {
    font-size: 8px;
    font-weight: 700;
    color: var(--overdue);
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .remove-btn {
    font-size: 14px; color: var(--text3); cursor: pointer;
    border: none; background: none; padding: 0 1px; line-height: 1;
  }
  .remove-btn:hover { color: var(--overdue); }

  /* ── Day timeline ── */
  .timeline-header {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--section-label);
    padding: 8px 4px 4px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hour-row {
    display: flex;
    gap: 0;
    min-height: 28px;
    padding: 2px 0;
    align-items: flex-start;
  }
  .hour-row.current { background: var(--accent-light); border-radius: 5px; padding: 3px 4px; }
  .hour-lbl {
    width: 42px;
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 600;
    color: var(--text3);
    padding-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .hour-row.current .hour-lbl { color: var(--accent); }

  .hour-tasks { flex: 1; display: flex; flex-direction: column; gap: 2px; }

  .mini-task {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: default;
  }
  .mini-task .mini-cb {
    width: 12px; height: 12px;
    border-radius: 3px;
    border: 1.5px solid var(--text3);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
    color: #fff;
  }
  .mini-task.done .mini-cb { background: var(--done); border-color: var(--done); }
  .mini-task.done .mini-title { text-decoration: line-through; color: var(--text3); }
  .mini-task.overdue .mini-title { color: var(--overdue); }
  .mini-title {
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .hour-add {
    font-size: 10px;
    color: var(--text3);
    cursor: pointer;
    padding: 1px 0;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .hour-row:hover .hour-add { opacity: 1; }

  /* ── Add form ── */
  .add-row {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .add-row input, .add-row select {
    font-size: 11px;
    padding: 4px 6px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  .add-row input:focus, .add-row select:focus { border-color: var(--accent); }
  .add-row input[type="text"] { flex: 1; min-width: 0; }
  .add-row select { width: 62px; }
  .add-row input[type="date"] { width: 100px; }

  .add-actions { display: flex; gap: 4px; padding: 2px 0 4px; }
  .btn-ok {
    font-size: 10px; padding: 3px 10px; border-radius: 4px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; font-family: inherit;
  }
  .btn-no {
    font-size: 10px; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--border); background: transparent; cursor: pointer;
    color: var(--text2); font-family: inherit;
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    flex-shrink: 0;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .bottom-btn {
    font-size: 10px; color: var(--accent);
    border: none; background: none; cursor: pointer;
    font-family: inherit; font-weight: 600;
    padding: 3px 8px; border-radius: 4px;
  }
  .bottom-btn:hover { background: var(--accent-light); }
  .bottom-btn.danger { color: var(--text3); }
  .bottom-btn.danger:hover { color: var(--overdue); background: var(--overdue-bg); }

  .shortcut-hint { font-size: 9px; color: var(--text3); }
</style>
</head>
<body>

<div id="app"></div>

<script>
const HOURS = Array.from({ length: 17 }, (_, i) => i + 6);
const PRIORITIES = ["Low", "Medium", "High", "Urgent"];
const KEY = "daily-planner-tasks";

let tasks = JSON.parse(localStorage.getItem(KEY) || "[]");
let addingHour = null;
let showTimeline = false;

function save() { localStorage.setItem(KEY, JSON.stringify(tasks)); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtH(h) {
  const s = h >= 12 ? "PM" : "AM";
  return (h === 0 ? 12 : h > 12 ? h - 12 : h) + s;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function isOverdue(t) {
  if (t.done) return false;
  const now = new Date();
  const td = new Date(todayStr() + "T00:00:00");
  const dd = new Date(t.dueDate + "T00:00:00");
  if (dd < td) return true;
  return dd.getTime() === td.getTime() && now.getHours() > t.hour;
}

function render() {
  const now = new Date();
  const hr = now.getHours();
  const dateStr = now.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const timeStr = now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

  // Categorize tasks
  const current = tasks.filter(t => t.hour === hr && !t.done);
  const next = tasks.filter(t => t.hour > hr && !t.done && t.dueDate === todayStr()).sort((a, b) => a.hour - b.hour);
  const overdue = tasks.filter(t => isOverdue(t)).sort((a, b) => a.hour - b.hour);
  const doneCount = tasks.filter(t => t.done).length;

  let html = "";

  // ── Top bar
  html += `<div class="topbar">
    <span class="clock">${timeStr}</span>
    <span class="date-label">${dateStr}</span>
  </div>`;

  html += `<div class="scroll-area">`;

  // ── NOW
  html += `<div class="section">
    <div class="section-header"><span class="dot dot-now"></span> NOW · ${fmtH(hr)}</div>`;
  if (current.length === 0) {
    html += `<div class="empty-msg">Nothing scheduled right now</div>`;
  }
  current.forEach(t => { html += taskCard(t, true); });
  html += `</div>`;

  // ── OVERDUE (only if any)
  if (overdue.length > 0) {
    html += `<div class="section">
      <div class="section-header"><span class="dot dot-overdue"></span> OVERDUE · ${overdue.length}</div>`;
    overdue.forEach(t => { html += taskCard(t, false); });
    html += `</div>`;
  }

  // ── NEXT UP
  if (next.length > 0) {
    html += `<div class="section">
      <div class="section-header"><span class="dot dot-next"></span> NEXT UP</div>`;
    next.slice(0, 4).forEach(t => { html += taskCard(t, false); });
    if (next.length > 4) html += `<div class="empty-msg">${next.length - 4} more later…</div>`;
    html += `</div>`;
  }

  // ── FULL DAY TIMELINE
  html += `<div class="timeline-header">
    <span>FULL DAY</span>
    <span style="cursor:pointer;font-size:12px;" onclick="toggleTimeline()">${showTimeline ? "▾" : "▸"}</span>
  </div>`;

  if (showTimeline) {
    HOURS.forEach(hour => {
      const isCurr = hour === hr;
      const hTasks = tasks.filter(t => t.hour === hour);
      html += `<div class="hour-row ${isCurr ? "current" : ""}">`;
      html += `<div class="hour-lbl">${fmtH(hour)}</div>`;
      html += `<div class="hour-tasks">`;
      hTasks.forEach(t => {
        const cls = t.done ? "done" : isOverdue(t) ? "overdue" : "";
        html += `<div class="mini-task ${cls}">
          <div class="mini-cb" onclick="toggle('${t.id}')">${t.done ? "✓" : ""}</div>
          <span class="mini-title">${esc(t.title)}</span>
        </div>`;
      });
      if (addingHour === hour) {
        html += addForm(hour);
      } else {
        html += `<div class="hour-add" onclick="startAdd(${hour})">+ add</div>`;
      }
      html += `</div></div>`;
    });
  } else {
    html += `<div class="empty-msg" style="cursor:pointer" onclick="toggleTimeline()">Click to expand full schedule</div>`;
  }

  html += `</div>`; // scroll-area

  // ── Bottom bar
  html += `<div class="bottom-bar">
    <span class="shortcut-hint">⌘⇧P to toggle</span>
    <span>`;
  if (doneCount > 0) {
    html += `<button class="bottom-btn danger" onclick="clearDone()">Clear ${doneCount} done</button>`;
  }
  html += `<button class="bottom-btn" onclick="quickAdd()">+ Quick Add</button>`;
  html += `</span></div>`;

  document.getElementById("app").innerHTML = html;

  // Focus input if adding
  const inp = document.getElementById("add-input");
  if (inp) inp.focus();
}

function taskCard(t, showTime) {
  const overdue = isOverdue(t);
  const cls = t.done ? "done" : overdue ? "overdue" : "";
  return `<div class="task ${cls}">
    <div class="cb" onclick="toggle('${t.id}')">${t.done ? "✓" : ""}</div>
    <div class="task-info">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-sub">
        <span class="pri pri-${t.priority.toLowerCase()}">${t.priority}</span>
        <span>${fmtH(t.hour)}</span>
        <span>Due ${t.dueDate}</span>
      </div>
    </div>
    ${overdue && !t.done ? '<span class="badge-overdue">OVERDUE</span>' : ""}
    ${t.done ? `<button class="remove-btn" onclick="removeTask('${t.id}')">×</button>` : ""}
  </div>`;
}

function addForm(hour) {
  return `<div>
    <div class="add-row">
      <input type="text" id="add-input" placeholder="Task…" onkeydown="if(event.key==='Enter')doAdd(${hour});if(event.key==='Escape')cancelAdd()" />
    </div>
    <div class="add-row">
      <select id="add-pri">${PRIORITIES.map(p => `<option ${p === "Medium" ? "selected" : ""}>${p}</option>`).join("")}</select>
      <input type="date" id="add-due" value="${todayStr()}" />
      <button class="btn-ok" onclick="doAdd(${hour})">Add</button>
      <button class="btn-no" onclick="cancelAdd()">✕</button>
    </div>
  </div>`;
}

function toggle(id) {
  const t = tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  save(); render();
}

function removeTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  save(); render();
}

function startAdd(hour) {
  showTimeline = true;
  addingHour = hour;
  render();
}

function quickAdd() {
  const hr = new Date().getHours();
  const nearest = HOURS.find(h => h >= hr) || HOURS[HOURS.length - 1];
  startAdd(nearest);
  // Scroll to the adding row
  setTimeout(() => {
    const inp = document.getElementById("add-input");
    if (inp) inp.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 50);
}

function doAdd(hour) {
  const title = document.getElementById("add-input").value.trim();
  if (!title) return;
  const pri = document.getElementById("add-pri").value;
  const due = document.getElementById("add-due").value;
  tasks.push({ id: Date.now().toString(), hour, title, priority: pri, dueDate: due, done: false });
  save(); addingHour = null; render();
}

function cancelAdd() { addingHour = null; render(); }
function clearDone() { tasks = tasks.filter(t => !t.done); save(); render(); }
function toggleTimeline() { showTimeline = !showTimeline; render(); }

render();
setInterval(render, 30000);
</script>
</body>
</html>
